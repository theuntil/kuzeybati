# =============================================================
#  KUZEYBATI HABER — SİTE (Dokploy Compose)
#
#  Bot ve AI servisi AYRI compose dosyalarında. Bu servis
#  sadece okur; ne feed'e ne R2'ye yazar.
# =============================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_CDN_BASE: ${NEXT_PUBLIC_CDN_BASE}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    env_file:
      - .env
    # ┌─ BU LİSTE BEYAZ LİSTEDİR ⚠️ ────────────────────────────┐
    # │ Burada YAZMAYAN bir değişken, Dokploy'un Environment      │
    # │ sekmesine girilse bile konteynere ULAŞMAZ. Yeni değişken  │
    # │ eklerken BURAYA DA EKLE.                                   │
    # └────────────────────────────────────────────────────────────┘
    environment:
      NODE_ENV: production
      PORT: "3000"

      # ---- Supabase (çalışma anında, NEXT_PUBLIC_ öneki YOK) ----
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SITE_URL: ${SITE_URL:-https://kuzeybatihaber.com.tr}
      CDN_BASE: ${CDN_BASE:-https://medya.kuzeybatihaber.com.tr}

      # ---- Cloudflare R2 (avatar, yazar görselleri) ----
      # ⚠ SUNUCUDA kalır; tarayıcıya hiç gitmez.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-haber-medya}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      # ---- Mail servisi ----
      MAIL_API_URL: ${MAIL_API_URL:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}

      # ---- ISR yeniden doğrulama ----
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}

      # ---- Dış servisler ----
      SKOR_API_URL: ${SKOR_API_URL:-}
      SKOR_API_KEY: ${SKOR_API_KEY:-}
      ECZANE_API_URL: ${ECZANE_API_URL:-}
      ECZANE_API_KEY: ${ECZANE_API_KEY:-}
      PRAYER_METHOD: ${PRAYER_METHOD:-13}
    ports:
      - "3000:3000"

    deploy:
      resources:
        limits:
          # Bot 4 CPU / 5 GB alıyor. Site render ağırlıklı,
          # 1.5 CPU rahat yeter; sunucuda diğer projelere yer kalsın.
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/markets"]
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true
